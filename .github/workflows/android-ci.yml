name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test, lint, and assemble debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mnm_au_seekers_test
          POSTGRES_USER: mnm_test
          POSTGRES_PASSWORD: mnm_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnm_test -d mnm_au_seekers_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://mnm_test:mnm_test_password@localhost:5432/mnm_au_seekers_test
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Verify database migrations
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Test backend API
        run: python -m pytest
